name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Ensure shellcheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck
            else sudo apt-get update -q && sudo apt-get install -y -q shellcheck; fi
          fi
          shellcheck --version

      - name: Syntax
        shell: bash
        run: bash -n n8nctl.sh test/smoke.sh test/stubs/curl test/stubs/docker

      - name: ShellCheck
        shell: bash
        run: shellcheck n8nctl.sh test/smoke.sh test/stubs/curl test/stubs/docker

      - name: Preload, network check and gallery parse
        shell: bash
        run: |
          # n8n will not start if runtime/force-http1.cjs fails to load.
          node --check runtime/force-http1.cjs
          node --check test/netcheck.js
          python3 -I -B -c 'import ast, sys; [ast.parse(open(f, encoding="utf-8").read(), f) for f in sys.argv[1:]]' \
            templates-api/server.py templates-api/build.py

      - name: Fixture integrity
        shell: bash
        run: |
          # The smoke test asserts this hash was logged; keep the vendored installer in sync.
          want=b4a999179859558f4bdc22305f714675ba142adeaa626c6ffba84f0e11147612
          if command -v sha256sum >/dev/null 2>&1; then got=$(sha256sum test/fixtures/get-n8n.sh | cut -d' ' -f1)
          else got=$(shasum -a 256 test/fixtures/get-n8n.sh | cut -d' ' -f1); fi
          [ "$got" = "$want" ] || { echo "fixture hash $got != $want"; exit 1; }

      - name: Smoke test (stubbed docker and curl)
        shell: bash
        run: test/smoke.sh
